aid: reforge
name: Reforge
description: >-
  Reforge is the company behind Reforge Launch, a developer platform for feature
  flags, live configuration, dynamic log levels, and experimentation delivered as
  a service (the product formerly known as Prefab). Applications integrate Reforge
  through first-party SDKs for Node, JavaScript, React, Python, Ruby, Go, and Java
  plus a command-line interface, evaluating flags and configuration against user
  context with server- and client-side SDK keys. Configuration is delivered over a
  global content network (primary/secondary.reforge.com) with server-sent events
  and polling for real-time updates, while telemetry flows to api.reforge.com.
  Reforge is backed by a16z and Insight Partners.
